# Üretim / yükleme ayarları
paths:
  emoji_dir: "assets/emoji"        # Fluent Emoji 3D PNG'leri (tools/fetch_fluent_emoji.py ile iner)
  hero_dir: "assets/hero"          # maskot görselleri (öncelik 1)
  options_dir: "assets/options"    # seçenek kareleri için gerçekçi fotoğraflar (öncelik 2: hayvanlar; 3: diğer nesneler)
  music_dir: "assets/music"        # YouTube Audio Library'den indirilen parçalar (mp3)
  out_dir: "out"
  scenarios_dir: "scenarios"
  archive_dir: "out/archive"       # üretim kanıtı: senaryo json, promptlar, seedler, render logu

cadence:
  videos_per_day: 3
  max_per_day: 3
  publish_time_utc: "23:00"        # 16:00 PT yaz / kışın 00:00 UTC'ye kaydır
  min_stock_days: 5
  ramp:                            # tarihe göre kadans (run_daily.py bunu kullanır)
    - {from: "2026-09-12", per_day: 2}          # bugüne kadar üretilmiş takvim
    - {from: "2026-09-14", per_day: 3}          # verinin tatlı noktası; kütüphane büyüdükçe artar
  quota_uploads_per_day: 6                      # 10.000 birim / 1.600 = 6
  slots_utc: ["23:00", "19:00", "15:00", "21:00", "17:00", "13:00"]
  # Gün içindeki videolar bu sırayla slot alır; liste GÜÇ SIRASINA göre dizili, yani
  # 3/gün'de 23:00 + 19:00 + 15:00 kullanılır (TR 02:00 / 22:00 / 18:00, ET 19:00 / 15:00 / 11:00).
  # 23:00 UTC = 16:00 PT, kanıtlanmış prime time. Hepsi aynı dakikada yayına girerse spam görünür.

images:
  priority: ["hero", "animal_options", "other_options"]   # Gemini/SD kotası sırayla bunlara harcanır
  animal_words: [cat, kitten, dog, puppy, cow, chicken, bird, fish, rabbit, bunny, horse, pig, sheep, goat, duck, mouse, hamster, fox, bear, lion, tiger, elephant, monkey, frog, turtle, snake, owl, butterfly, bee]

uniqueness:
  no_repeat_round_days: 90         # aynı tur (soru+seçenek seti) 90 gün tekrar edemez
  no_same_story_consecutive: true  # art arda iki video aynı hikâye iskeleti kullanamaz
  no_same_music_consecutive: true
  no_same_voice_consecutive: true

youtube:
  client_secret: "client_secret.json"
  token_file: "token.json"
  category_id: "22"                # People & Blogs
  default_language: "en"
  made_for_kids: true
  self_declared_made_for_kids: true
  title_template: "Choose Correctly. 🧠"
  description: |
    Can you choose correctly? 🧠 New quiz every day.
    All images in this video are AI-generated by us for entertainment.
    #shorts #quiz #chooseCorrectly
  tags: []                         # gereksiz; boş bırak

blocklist:                         # kod seviyesinde yasak (QC bunları reddeder)
  words: ["iphone", "lamborghini", "stanley", "pepsi", "coca", "nike", "roblox", "minecraft", "sonic", "barbie", "kids", "toddler", "preschool"]
  themes: ["crying animal", "abandoned", "injured", "blood", "like to save", "gore", "disabled"]
